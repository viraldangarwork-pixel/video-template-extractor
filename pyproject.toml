[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtpl"
version = "0.1.0"
description = "Reverse-engineer short-form videos (Reels, TikTok, Shorts) into editable templates and re-render them."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Viral Dangar", email = "viraldangar.work@gmail.com" }
]
keywords = [
  "video",
  "template",
  "reels",
  "shorts",
  "tiktok",
  "ffmpeg",
  "whisper",
  "ocr",
  "computer-vision",
  "beat-tracking"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scenedetect>=0.6.4",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "faster-whisper>=1.0",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rapidocr-onnxruntime>=1.2.3",
  "rapidfuzz>=3.0",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "fonttools>=4.40",
  "build>=1.0"
]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.28",
  "python-multipart>=0.0.9",
  "jinja2>=3.1"
]
all = [
  "pytest>=8",
  "fonttools>=4.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.28",
  "python-multipart>=0.0.9",
  "jinja2>=3.1"
]

[project.urls]
Homepage = "https://github.com/viraldangarwork-pixel/video-template-extractor"
Repository = "https://github.com/viraldangarwork-pixel/video-template-extractor.git"
Documentation = "https://github.com/viraldangarwork-pixel/video-template-extractor#readme"
Issues = "https://github.com/viraldangarwork-pixel/video-template-extractor/issues"

[project.scripts]
vtpl = "vtpl.cli:app"

[tool.setuptools.packages.find]
include = ["vtpl*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: runs FFmpeg on generated videos"]

[tool.setuptools.package-data]
vtpl = [
  "assets/fonts/*.ttf",
  "assets/fonts/*.json",
  "assets/fonts/*.md",
  "web/templates/*.html",
  "web/static/*"
]
