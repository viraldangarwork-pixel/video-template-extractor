[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtpl"
version = "0.1.0"
description = "Reverse-engineer short-form videos into editable templates and re-render them."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scenedetect>=0.6.4",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "faster-whisper>=1.0",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rapidocr-onnxruntime>=1.2.3",
  "rapidfuzz>=3.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fonttools>=4.40"]

[project.scripts]
vtpl = "vtpl.cli:app"

[tool.setuptools.packages.find]
include = ["vtpl*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: runs FFmpeg on generated videos"]

[tool.setuptools.package-data]
vtpl = ["assets/fonts/*.ttf", "assets/fonts/*.json", "assets/fonts/*.md"]
