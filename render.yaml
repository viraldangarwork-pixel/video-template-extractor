services:
  - type: web
    name: vtpl-web
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: VTPL_WHISPER_MODEL
        value: tiny
      - key: MAX_UPLOAD_MB
        value: 50
      - key: MAX_CONCURRENT_JOBS
        value: 1
      - key: AD_CLIENT_ID
        sync: false
      - key: CANONICAL_URL
        sync: false
